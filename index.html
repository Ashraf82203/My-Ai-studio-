
<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My AI Video Generator</title>
<style>
body{font-family:Arial,sans-serif;background:#101827;color:white;padding:18px;margin:0}
main{max-width:650px;margin:auto}
h1{color:#61f2bd;text-align:center}
.panel{background:#1d2a40;padding:18px;border-radius:14px;margin:16px 0}
textarea{width:100%;box-sizing:border-box;min-height:140px;padding:12px;font-size:16px;border-radius:8px}
button{width:100%;padding:14px;margin-top:12px;background:#61f2bd;border:0;border-radius:8px;font-size:17px;font-weight:bold}
button:disabled{opacity:.6}
#status{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.note{color:#c4d0e2;line-height:1.6}
</style>
</head>
<body>
<main>
<h1>🎬 AI Video Generator</h1>
<section class="panel">
<h3>اپنی ویڈیو کی کہانی لکھیں</h3>
<textarea id="prompt">A small colorful bird flying through a beautiful garden at sunrise, cinematic camera movement, realistic animation.</textarea>
<p class="note">یہ ٹیسٹ Magic Hour کو پرامپٹ بھیجے گا۔ ویڈیو بننے میں وقت لگ سکتا ہے۔</p>
<button id="make">🎬 AI ویڈیو بنائیں</button>
<p id="status">ویڈیو بنانے کے لیے بٹن دبائیں۔</p>
</section>
</main>
<script>
const workerURL = "https://bilawal-ai-video-api.ashrafm500.workers.dev/";

document.getElementById("make").addEventListener("click", async () => {
  const prompt = document.getElementById("prompt").value.trim();
  const status = document.getElementById("status");
  const button = document.getElementById("make");

  if (!prompt) {
    status.textContent = "براہ کرم پہلے کہانی لکھیں۔";
    return;
  }

  button.disabled = true;
  status.textContent = "درخواست بھیجی جا رہی ہے، انتظار کریں...";

  try {
    const response = await fetch(workerURL, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({prompt: prompt})
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || result.message || JSON.stringify(result));
    }

    status.textContent =
      "درخواست موصول ہو گئی!\n\n" +
      "Magic Hour کا جواب:\n" +
      JSON.stringify(result, null, 2) +
      "\n\nیہ ابتدائی مرحلہ ہے؛ ویڈیو کا نتیجہ حاصل کرنے کا مرحلہ ابھی باقی ہے۔";

  } catch (error) {
    status.textContent =
      "درخواست مکمل نہیں ہوئی:\n" + error.message +
      "\n\nاپنی API Key یہاں نہ لکھیں۔";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
