
<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI Video Generator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;padding:18px}
.container{max-width:600px;margin:auto}
h1{text-align:center;color:#62e6c5}
p{text-align:center;color:#d5deea}
.card{background:#1c293c;padding:18px;border-radius:16px;margin:15px 0}
label{display:block;margin:14px 0 7px;font-weight:bold}
textarea,select,input{width:100%;padding:12px;border:1px solid #526178;border-radius:9px;background:#101827;color:white;font-size:16px}
textarea{min-height:130px;resize:vertical}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#16b99a;color:#071c20;font-size:16px;font-weight:bold;margin-top:12px;cursor:pointer}
button:disabled{opacity:.5}
#preview{width:100%;max-height:400px;object-fit:contain;margin-top:12px;border-radius:10px;display:none}
#status{white-space:pre-wrap;overflow-wrap:anywhere;color:#62e6c5;text-align:center}
#download{display:none;text-align:center;color:#62e6c5;margin-top:16px}
small{color:#c5cfdd;line-height:1.7}
</style>
</head>
<body>
<div class="container">
<h1>🎬 Free AI Video Generator</h1>
<p>اپنی کہانی لکھیں، تصویر منتخب کریں اور ویڈیو بنائیں۔</p>

<div class="card">
<label for="language">زبان منتخب کریں / Select Language</label>
<select id="language">
<option value="ur-PK">اردو</option>
<option value="en-US">English</option>
<option value="hi-IN">हिन्दी</option>
<option value="ar-SA">العربية</option>
<option value="pa-IN">پنجابی</option>
<option value="bn-BD">বাংলা</option>
<option value="tr-TR">Türkçe</option>
<option value="fr-FR">Français</option>
<option value="es-ES">Español</option>
<option value="zh-CN">中文</option>
</select>

<label for="story">اپنی کہانی لکھیں</label>
<textarea id="story" placeholder="یہاں اپنی کہانی لکھیں...">ایک بچہ خوبصورت باغ میں کھیل رہا ہے۔ باغ میں رنگ برنگے پھول اور درخت ہیں۔ بچہ خوشی سے مسکرا رہا ہے۔</textarea>

<label for="picture">اپنی تصویر منتخب کریں</label>
<input id="picture" type="file" accept="image/*">
<img id="preview" alt="آپ کی منتخب کردہ تصویر">

<button id="speak">🔊 کہانی کی آواز سنیں</button>
<button id="stop">⏹ آواز بند کریں</button>
</div>

<div class="card">
<h3>🎥 اپنی ویڈیو بنائیں</h3>
<small>یہ مفت ورژن آپ کی منتخب کردہ تصویر اور کہانی سے ایک سادہ عمودی ویڈیو بناتا ہے۔ ویڈیو براؤزر میں تیار ہوگی۔</small>
<button id="make">🎬 ویڈیو بنائیں</button>
<p id="status">آپ کی کہانی اور تصویر تیار ہونے کے منتظر ہیں۔</p>
<a id="download" download="my-story-video.webm">⬇️ اپنی ویڈیو محفوظ کریں</a>
</div>
</div>

<script>
const story = document.getElementById('story');
const language = document.getElementById('language');
const picture = document.getElementById('picture');
const preview = document.getElementById('preview');
const statusText = document.getElementById('status');
const makeButton = document.getElementById('make');
let image = null;
let videoUrl = null;

picture.addEventListener('change', () => {
  const file = picture.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    statusText.textContent = 'براہ کرم تصویر منتخب کریں۔';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    image = new Image();
    image.onload = () => {
      preview.src = reader.result;
      preview.style.display = 'block';
      statusText.textContent = 'تصویر تیار ہے۔ اب ویڈیو بنا سکتے ہیں۔';
    };
    image.src = reader.result;
  };
  reader.readAsDataURL(file);
});

document.getElementById('speak').addEventListener('click', () => {
  if (!('speechSynthesis' in window)) {
    statusText.textContent = 'آپ کا براؤزر آواز کی سہولت فراہم نہیں کرتا۔';
    return;
  }
  const text = story.value.trim();
  if (!text) {
    statusText.textContent = 'پہلے اپنی کہانی لکھیں۔';
    return;
  }
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = language.value;
  speechSynthesis.speak(utterance);
});

document.getElementById('stop').addEventListener('click', () => {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
});

function drawCover(ctx, img, w, h) {
  const scale = Math.max(w / img.width, h / img.height);
  const sw = w / scale, sh = h / scale;
  ctx.drawImage(img, (img.width-sw)/2, (img.height-sh)/2, sw, sh,
                0, 0, w, h);
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split(/\s+/);
  const lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

makeButton.addEventListener('click', async () => {
  if (!image) {
    statusText.textContent = 'پہلے اپنی تصویر منتخب کریں۔';
    picture.focus();
    return;
  }
  if (!story.value.trim()) {
    statusText.textContent = 'پہلے اپنی کہانی لکھیں۔';
    story.focus();
    return;
  }
  if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {
    statusText.textContent = 'آپ کا براؤزر ویڈیو بنانے کی سہولت فراہم نہیں کرتا۔ Chrome میں کوشش کریں۔';
    return;
  }

  makeButton.disabled = true;
  document.getElementById('download').style.display = 'none';
  statusText.textContent = 'ویڈیو تیار ہو رہی ہے، براہ کرم انتظار کریں...';

  try {
    const canvas = document.createElement('canvas');
    canvas.width = 720;
    canvas.height = 1280;
    const ctx = canvas.getContext('2d');
    const stream = canvas.captureStream(24);
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp8')
      ? 'video/webm;codecs=vp8' : 'video/webm';

    const recorder = new MediaRecorder(stream, {mimeType:mime});
    const chunks = [];
    recorder.ondataavailable = e => {
      if (e.data.size > 0) chunks.push(e.data);
    };

    const text = story.value.trim();
    const lines = wrapText(ctx, text, 600);
    let start = 0;
    const duration = 12000;

    function frame(now) {
      if (!start) start = now;
      const elapsed = now - start;

      drawCover(ctx, image, canvas.width, canvas.height);

      const shade = ctx.createLinearGradient(0, 600, 0, 1280);
      shade.addColorStop(0, 'rgba(0,0,0,0)');
      shade.addColorStop(1, 'rgba(0,0,0,0.88)');
      ctx.fillStyle = shade;
      ctx.fillRect(0, 500, 720, 780);

      ctx.textAlign = 'center';
      ctx.direction = language.value.startsWith('ur') ||
                      language.value.startsWith('ar') ? 'rtl' : 'ltr';
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 34px Arial';
      const visible = Math.min(lines.length,
        Math.max(1, Math.floor(elapsed / 1800) + 1));
      const shown = lines.slice(0, visible);
      let y = 1050 - shown.length * 48;
      for (const line of shown) {
        ctx.fillText(line, 360, y, 620);
        y += 48;
      }

      ctx.font = 'bold 27px Arial';
      ctx.fillStyle = '#62e6c5';
      ctx.fillText('My Story', 360, 1200);

      if (elapsed < duration) {
        requestAnimationFrame(frame);
      } else {
        recorder.stop();
      }
    }

    recorder.onstop = () => {
      stream.getTracks().forEach(track => track.stop());
      const blob = new Blob(chunks, {type:'video/webm'});
      if (videoUrl) URL.revokeObjectURL(videoUrl);
      videoUrl = URL.createObjectURL(blob);
      const link = document.getElementById('download');
      link.href = videoUrl;
      link.style.display = 'block';
      statusText.textContent = 'ویڈیو تیار ہے! نیچے محفوظ کرنے کے لنک پر دبائیں۔';
      makeButton.disabled = false;
    };

    recorder.start();
    requestAnimationFrame(frame);
  } catch (error) {
    statusText.textContent = 'ویڈیو بنانے میں مسئلہ آیا۔ Chrome میں دوبارہ کوشش کریں۔';
    makeButton.disabled = false;
  }
});
</script>
</body>
</html>
